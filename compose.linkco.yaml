name: linkco-local
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linkco
      POSTGRES_USER: linkco
      POSTGRES_PASSWORD: ${LINKCO_DB_PASSWORD:?Run node linkco-local/configure.cjs first}
    volumes:
      - linkco_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U linkco -d linkco']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - linkco_redis:/data
  drive:
    image: linkco-local-drive
    build:
      context: .
      dockerfile: linkco-local/Dockerfile
    restart: unless-stopped
    ports:
      - '${LINKCO_BIND_ADDRESS:-0.0.0.0}:${LINKCO_PORT:-8090}:80'
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: linkco
      POSTGRES_USER: linkco
      POSTGRES_PASSWORD: ${LINKCO_DB_PASSWORD:?Run node linkco-local/configure.cjs first}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${LINKCO_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${LINKCO_ADMIN_PASSWORD:?Run node linkco-local/configure.cjs first}
      NEXTCLOUD_TRUSTED_DOMAINS: ${LINKCO_TRUSTED_HOSTS:-localhost 127.0.0.1}
      LINKCO_TRUSTED_HOSTS: ${LINKCO_TRUSTED_HOSTS:-localhost 127.0.0.1}
      PHP_UPLOAD_LIMIT: 1G
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - linkco_html:/var/www/html
  cron:
    image: linkco-local-drive
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - drive
    environment:
      REDIS_HOST: redis
      LINKCO_TRUSTED_HOSTS: ${LINKCO_TRUSTED_HOSTS:-localhost 127.0.0.1}
    volumes:
      - linkco_html:/var/www/html
volumes:
  linkco_database:
  linkco_redis:
  linkco_html:
